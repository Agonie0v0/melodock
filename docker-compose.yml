services:
  melokeep-webui:
    container_name: melokeep
    image: ghcr.io/agonie0v0/melokeep:latest
    restart: unless-stopped
    init: true
    ports:
      - "8765:8765"
    volumes:
      - ./music:/music
      - ./data:/data
    environment:
      MELOKEEP_USER: admin
      MELOKEEP_PASS: '请改成你自己的密码'
      # NAS 有专用目录用户时，取消注释并填写其 UID/GID（在 NAS 上执行 id 用户名）
      # PUID: '1000'
      # PGID: '1000'
